name: Build & Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Copy and Rename APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/Andromote.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Andromote-apk
          path: output/Andromote.apk
          if-no-files-found: error

  build-windows:
    name: 💻 Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Standalone Executable
        run: |
          python windows/build_exe.py

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Andromote-exe
          path: dist/Andromote.exe
          if-no-files-found: error

  publish-release:
    name: 🚀 Publish GitHub Release
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: Andromote-apk
          path: release_assets/

      - name: Download Windows EXE
        uses: actions/download-artifact@v4
        with:
          name: Andromote-exe
          path: release_assets/

      - name: List Release Assets
        run: ls -la release_assets/

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Andromote v1.0.${{ github.run_number }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Andromote v1.0.${{ github.run_number }}

            ### 📦 Included Downloads
            * **`Andromote.apk`** — Android companion app with tactile Wii Remote & auto-rotating NES gamepad layouts.
            * **`Andromote.exe`** — Standalone Windows receiver with 1€ filter, Wii Gestures, and Dolphin Cemuhook DSU server.

            ### 🚀 Quick Start
            1. Run `Andromote.exe` on your PC.
            2. Install `Andromote.apk` on your phone.
            3. Pair via local Wi-Fi with the 4-digit PIN.
            4. Enjoy 1:1 motion cursor pointing or direct Dolphin Emulator motion gaming!
          files: |
            release_assets/Andromote.apk
            release_assets/Andromote.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
